# The weekly chain, declared once.
#
# Until this file existed the chain was eleven commands in a markdown table
# that a person pasted into a terminal, which meant three things had to be
# remembered every week: the flags run before the backtest, --full-refresh
# goes everywhere, and nothing may run after the gate refuses. A table cannot
# express a dependency; this file can, and W8 will invoke the same file from
# CI so local and CI cannot drift apart.
#
#   task --list          every step, with what it does
#   task weekly          the whole chain, in order, stopping where it should
#   task <name>          one step, to resume a run that died in the middle
#
# QUICKSTART.md keeps the prose: what each step means, what the monitoring
# warnings look like, and which failures are not warnings.

version: '3'

vars:
  # The venv sits one level above the dbt project, which is where it was
  # built. Override on the command line if yours is elsewhere:
  #   task weekly VENV=/path/to/.venv
  # On this machine the venv sits one level above the dbt project; on a CI
  # runner it is created inside the checkout. Prefer a local one, fall back to
  # the parent, and let VENV in the environment override both.
  VENV:
    sh: echo "${VENV:-$([ -x .venv/bin/python ] && echo "$PWD/.venv" || echo "$PWD/../.venv")}"
  PY: '{{.VENV}}/bin/python'
  DBT: '{{.VENV}}/bin/dbt'

  # The F2 capacity. Resuming and pausing are ARM operations, a different
  # permission plane from everything else here — see docs/architecture.md.
  CAPACITY: nzfuelcapacity
  CAPACITY_RG: nz-fuel-price-rg
  # `sh:` rather than a plain string on purpose: go-task does NOT read vars
  # from the environment (verified 7 Sep 2026 — an exported CAPACITY_ID was
  # ignored while a command-line one won), so a workflow setting it as an env
  # var would silently get the default. Reading it through the shell makes both
  # work, and the subscription id is not a secret: it is already in
  # .claude/rules/working-style.md and in the semantic model.
  CAPACITY_ID:
    sh: echo "${CAPACITY_ID:-/subscriptions/e30d2fa4-fb6e-48c5-b3cd-5f9c3f270159/resourceGroups/nz-fuel-price-rg/providers/Microsoft.Fabric/capacities/nzfuelcapacity}"

tasks:

  default:
    desc: List the steps
    cmds:
      - task --list
    silent: true

# --- preflight ---------------------------------------------------------------

  env:
    desc: Check the venv is there and carries the fabric adapter
    silent: true
    cmds:
      - |
        if [ ! -x "{{.PY}}" ]; then
          echo "no interpreter at {{.PY}}"
          echo "build it:  python3.12 -m venv {{.VENV}} && {{.VENV}}/bin/pip install -r requirements.txt"
          exit 1
        fi
        if ! "{{.DBT}}" --version 2>/dev/null | grep -q 'fabric:'; then
          echo "dbt at {{.DBT}} does not register the fabric adapter"
          exit 1
        fi
        echo "venv ok — $({{.PY}} --version), fabric adapter registered"

# --- the capacity, and the ingest that needs it awake ------------------------

  capacity-status:
    desc: "Is the capacity awake? (read-only)"
    silent: true
    cmds:
      - |
        state=$(az resource show --ids "{{.CAPACITY_ID}}" --query properties.state -o tsv)
        echo "capacity {{.CAPACITY}}: $state"

  capacity-resume:
    desc: "Wake the capacity and wait until it reports Active — it bills from here"
    silent: true
    cmds:
      - |
        state=$(az resource show --ids "{{.CAPACITY_ID}}" --query properties.state -o tsv)
        if [ "$state" = "Active" ]; then echo "capacity already Active"; exit 0; fi
        echo 'resuming {{.CAPACITY}} — NZ$0.729/hour from now'
        az resource invoke-action --ids "{{.CAPACITY_ID}}" --action resume >/dev/null
        # The resume is asynchronous and everything downstream fails hard with
        # `this Fabric capacity is currently not active`, so wait rather than hope.
        for i in $(seq 1 40); do
          sleep 15
          state=$(az resource show --ids "{{.CAPACITY_ID}}" --query properties.state -o tsv)
          [ "$state" = "Active" ] && { echo "capacity Active after $((i * 15))s"; exit 0; }
        done
        echo "capacity still $state after 10 min — giving up"; exit 1

  capacity-pause:
    desc: "Pause the capacity. Safe to run when it is already paused"
    silent: true
    cmds:
      - |
        state=$(az resource show --ids "{{.CAPACITY_ID}}" --query properties.state -o tsv)
        if [ "$state" = "Paused" ]; then echo "capacity already Paused"; exit 0; fi
        az resource invoke-action --ids "{{.CAPACITY_ID}}" --action suspend >/dev/null
        echo "capacity paused"

  deps:
    # `dbt_packages/` is gitignored, so this is a setup step on any fresh
    # checkout, CI included. It needs no capacity and no warehouse.
    desc: "Install the dbt packages named in packages.yml"
    cmds:
      - '"{{.DBT}}" deps'

  ingest:
    desc: "Start ingest_mbie_weekly and wait for it (step 0) — replaces the portal click"
    cmds:
      - '"{{.PY}}" pipeline/run_ingest.py'

  sync-endpoint:
    # Only for the path where the copy is not being run — `ingest` does this
    # itself as its last act, because a copy that has not been picked up by the
    # SQL endpoint is not a finished ingest.
    desc: "Force the bronze SQL analytics endpoint to catch up with the Lakehouse"
    cmds:
      - '"{{.PY}}" pipeline/run_ingest.py --sync-only'

# --- the gate ----------------------------------------------------------------

  gate:
    # Call it as `task -x gate` when the exit code matters to the caller: task
    # otherwise reports 201 for any failed task instead of passing the
    # command's code through, and this task's whole point is which code it
    # returns. Inside `weekly` that does not matter — any non-zero stops the
    # chain, which is the intent — but CI needs to tell 2 from 1.
    desc: "Freshness gate — the only step allowed to stop the run (0 go / 2 nothing to do / 1 look). Use `task -x gate` if you need the code"
    deps: [env]
    silent: true
    cmds:
      - |
        set +e
        "{{.PY}}" pipeline/gate.py
        code=$?
        set -e
        case $code in
          0) echo ""; echo "GATE: a new week landed — the chain continues." ;;
          2) echo ""
             echo "GATE: nothing to do. No new week, so the chain does not run."
             echo "This is not a failure; it is the gate doing its job. Any"
             echo "error task prints after this line means only that the chain"
             echo "stopped here, which is the intended outcome." ;;
          *) echo ""
             echo "GATE: stop and look. Read the reason above before rerunning"
             echo "anything — do not refresh Power BI." ;;
        esac
        exit $code

# --- steps that need the capacity awake --------------------------------------

  aip:
    desc: "Collect the AIP weeks (step 1) — the only check on a stale source"
    cmds:
      - '"{{.PY}}" pipeline/aip_check.py'

  snapshot:
    desc: "Revision history — Provisional to Final (step 2)"
    cmds:
      - '"{{.DBT}}" snapshot'

  build:
    desc: "Bronze to silver, gold and monitoring (step 3)"
    cmds:
      - '"{{.DBT}}" run --full-refresh'

  test:
    desc: "Tests (step 4). Everything outside `monitoring` must pass; monitoring only warns — read the output"
    cmds:
      - '"{{.DBT}}" test'

  panel:
    desc: "Panel out of the warehouse into data/panel_weekly.csv (step 5)"
    cmds:
      - '"{{.PY}}" pipeline/export_panel.py'

  report:
    desc: "Rebuild the table Report 1 reads (step 9)"
    cmds:
      - '"{{.DBT}}" run --select forecast_accuracy --full-refresh'

  close:
    desc: "Close the run — records the week as processed, which the gate reads next time (step 10)"
    cmds:
      - '"{{.PY}}" pipeline/mark_processed.py'

# --- local steps, no capacity needed -----------------------------------------

  flags:
    desc: "Regime axes from the panel (step 6). MUST run before `backtest`"
    cmds:
      - '"{{.PY}}" pipeline/build_period_flags.py'

  backtest:
    desc: "Refit every method at every cutoff, write the forecast seeds (step 7)"
    cmds:
      - '"{{.PY}}" pipeline/backtest.py'

  offline:
    desc: "The two local steps in the order that matters — flags, then backtest"
    cmds:
      - task: flags
      - task: backtest

# --- the chain ---------------------------------------------------------------

  weekly:
    desc: "The whole weekly chain, in order. Resume a failed run with `task <step>`"
    cmds:
      - task: gate
      - task: aip
      - task: snapshot
      - task: build
      - task: test
      - task: panel
      - task: flags
      - task: backtest
      - task: report
      - task: close
      - |
        echo ""
        echo "Chain finished. Two things are still yours to do:"
        echo "  - refresh the Power BI dataset"
        echo "  - read the monitoring WARNs above; a green run is not a quiet one"

  unattended:
    desc: "Everything, including waking the capacity and pausing it afterwards. What CI runs"
    cmds:
      - task: capacity-resume
      # `defer` runs even when a task below fails, so a broken run does not
      # leave the capacity billing. It does NOT survive the process being
      # killed — the workflow's own always() step and the 23:00 NZT auto-pause
      # are the second and third lines of defence.
      - defer: { task: capacity-pause }
      - task: ingest
      - task: weekly

# --- odds and ends -----------------------------------------------------------

  signals:
    desc: "This week's monitoring signals only, without running the rest of the tests"
    cmds:
      - '"{{.DBT}}" test --select monitoring'

  revisions:
    desc: "What MBIE changed under us in the last snapshot run"
    cmds:
      - '"{{.DBT}}" show --select monitor_revision_summary --limit 20'

  setup:
    desc: "Build the venv from the pinned lock"
    cmds:
      - python3.12 -m venv "{{.VENV}}"
      - '"{{.VENV}}/bin/pip" install -r requirements.txt'
