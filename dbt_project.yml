name: nz_fuel_price_project
version: 1.0.0
profile: nz_fuel_price_project
model-paths:
- models
analysis-paths:
- analyses
test-paths:
- tests
seed-paths:
- seeds
macro-paths:
- macros
snapshot-paths:
- snapshots
clean-targets:
- target
- dbt_packages
models:
  nz_fuel_price_project:
    +materialized: table
    silver:
      +materialized: table
      +docs:
        node_color: '#0d9488'
    gold:
      +docs:
        node_color: '#6b21a8'
    monitoring:
      +schema: monitoring
      +docs:
        node_color: '#475569'
seeds:
  nz_fuel_price_project:
    +docs:
      node_color: '#b45309'
    # The `monitoring:` sub-config went with the AIP seed on 7 Sep 2026. Only
    # hand-written configuration is seeded now — `periods` and
    # `variable_mapping` — and both belong in dbo.

vars:
  volatility_window_weeks: 6

  # Monitoring thresholds, in the units the AIP comparison works in:
  # USD/bbl, week-on-week move. A move smaller than the first is noise and
  # is never flagged; ours coming in under the second times Argus's is the
  # shape a stale ingest makes. Both carried over from pipeline/aip_check.py,
  # where they were set against 20 weeks of comparison, not derived.
  aip_move_threshold_usd: 2
  aip_damping_ratio: 0.25

  # Below this, a rewritten Final value is a representation artefact rather
  # than a revision, and `revisions_rewrote_a_final_week` does not flag it.
  # Set 27 Aug 2026, the first time that test fired: MBIE republished 40 weeks
  # of 2023-24 with `Taxes`, `Price excluding tax` and `Importer margin`
  # moving by 0.00002 - 0.00022 c/L in compensating directions, leaving the
  # pump price untouched. Real revisions in the same run ran to 2.221 c/L, so
  # the gap either side of this number is wide. Empirical, not derived — the
  # smallest genuine revision has never been measured, and that is what would
  # set it properly.
  #
  # Applies to NZD c/L only. `value_delta` carries each variable's own unit,
  # and 0.001 means something entirely different on an exchange rate; rows in
  # any other unit are still flagged unconditionally.
  revision_noise_threshold_cpl: 0.001
