
name: Pause capacity (watchdog)

# The third line of defence, behind `defer` inside task and the always() step
# in weekly.yml. Both of those run inside the weekly job, so neither survives
# the runner being cancelled, evicted or timed out — and a capacity left awake
# bills NZ$0.729/hour until the 23:00 NZT auto-pause, which is the fourth line
# and can be hours away.
#
# It refuses to act while a weekly run is still going, so a slow ingest is never
# cut off mid-chain: a late pause costs cents, a pause through a running load
# costs the week's data.
#
# **It follows the load, not the clock — 19 Sep 2026.** `workflow_run` fires
# server-side on any conclusion of `Weekly load`: success, failure, cancellation
# or timeout. That is the case this watchdog exists for, and it now cannot be
# missed. The two crons used to race instead: the load and the watchdog were
# half an hour apart, so a load delayed past the watchdog's slot — which is what
# happened on both real firings — meant the watchdog ran first, found nothing in
# flight and a capacity still asleep, exited green having guarded nothing, and
# did not fire again for a week.
#
# The one cron that remains is belt and braces, for a `workflow_run` event that
# never arrives. It sits two hours behind the load's own start rather than half
# an hour, and on :52, so it is not racing anything: by then the load has either
# finished or died, and either way the capacity should be asleep. It is still
# eleven hours ahead of the 23:00 NZT auto-pause, which is the line behind it.
#
# This is the only cron left in the repository — `weekly.yml` has none, on
# purpose (19 Sep 2026). A monitor being late costs nothing; a load being late
# costs the week, which is why only one of the two is allowed to run on a
# schedule GitHub does not promise to keep.
#
# **It also says when there was no load at all — 24 Sep 2026.** The Logic App
# that starts the load is the same thing that mails when the load fails, so the
# one failure it cannot report is its own recurrence not firing. That happened
# on the very first Thursday: Logic Apps skips the first weekly recurrence when
# the start time is less than seven days after the deployment
# (`docs/ci_setup.md`, 7e). Nothing was dispatched, nothing was mailed, and the
# missing week was found by hand. The `missed-load` job below runs on this
# workflow's cron and fails when no `Weekly load` has succeeded, or is still
# going, since Wednesday 18:00 UTC; GitHub mails the failure. It lives here
# because the check has to sit outside the thing it checks, and a monitor that
# runs late still says the right thing.
#
# Scheduled since 8 Sep 2026, together with the run it guards.
on:
  workflow_run:
    workflows: ["Weekly load"]
    types: [completed]
  schedule:
    - cron: '52 23 * * 3'     # Wednesday 23:52 UTC — Thursday 11:52 NZST, 12:52 NZDT
  workflow_dispatch:
    inputs:
      since:
        description: "Missed-load check: count weekly runs created at or after this UTC time. Empty means Wednesday 18:00 UTC this week; a time in the future proves the alarm fires."
        required: false
        default: ""

concurrency:
  group: fabric-capacity
  cancel-in-progress: false

permissions:
  id-token: write
  actions: read

jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CAPACITY_ID: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/nz-fuel-price-rg/providers/Microsoft.Fabric/capacities/nzfuelcapacity
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Wait while a weekly load is still running
        run: |
          for i in $(seq 1 20); do
            running=$(gh run list --workflow weekly.yml --status in_progress --json databaseId --jq 'length')
            [ "$running" = "0" ] && { echo "no weekly run in flight"; exit 0; }
            echo "weekly load still running — waiting ($i)"
            sleep 60
          done
          echo "a weekly load has been running for 20 minutes; pausing anyway would"
          echo "break it, so this watchdog stands down. The 23:00 NZT auto-pause"
          echo "remains."
          exit 1

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pause it if it is awake
        run: |
          state=$(az resource show --ids "$CAPACITY_ID" --query properties.state -o tsv)
          echo "capacity is $state"
          if [ "$state" = "Active" ]; then
            az resource invoke-action --ids "$CAPACITY_ID" --action suspend >/dev/null
            echo "### Watchdog paused a capacity the weekly run left awake" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The alarm for the one failure the Logic App cannot report — see the header.
  # On the cron and by hand only: on `workflow_run` a load has just happened.
  missed-load:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SINCE: ${{ inputs.since }}

    steps:
      - name: Fail if no weekly load has run since Wednesday
        run: |
          if [ -z "$SINCE" ]; then
            # This week's Wednesday, 18:00 UTC: before the trigger's slot in
            # either season (20:07 UTC under NZDT, 21:07 under NZST), and long
            # after the previous week's run. %u is 1 on Monday, 3 on Wednesday.
            back=$(( ( $(date -u +%u) + 4 ) % 7 ))
            SINCE="$(date -u -d "-${back} days" +%F)T18:00:00Z"
          fi
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/weekly.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at >= \"${SINCE}\") | {id, event, status, conclusion, created_at}]")
          echo "weekly load runs created since ${SINCE}:"
          jq -r '.[] | "  \(.id)  \(.event)  \(.status)/\(.conclusion)  \(.created_at)"' <<<"$runs"
          alive=$(jq '[.[] | select(.conclusion == "success" or .status != "completed")] | length' <<<"$runs")
          [ "$alive" -gt 0 ] && { echo "a weekly load ran — nothing to report"; exit 0; }
          {
            echo "### No weekly load has succeeded since ${SINCE}"
            echo "Either the Logic App did not dispatch, or every run since then failed."
            echo "Read its run history in nz-fuel-price-rg, then \`gh workflow run weekly.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
