
name: Weekly load

# MBIE publishes on Wednesdays. Cron is UTC and New Zealand observes daylight
# saving, so the local hour drifts by one twice a year: 21:00 UTC Wednesday is
# 09:00 Thursday NZST and 10:00 Thursday NZDT. That is deliberate — an hour of
# drift costs nothing here, and a second schedule to correct it would be one
# more thing to keep right.
#
# Scheduled since 8 Sep 2026, after a manual run went green end to end:
# OIDC exchange, resume, ingest through the job API, the gate, and pause.
on:
  schedule:
    - cron: '0 21 * * 3'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: 'Skip the ingest and start at the gate (the file already landed)'
        type: boolean
        default: false

concurrency:
  group: fabric-capacity
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC, so no client secret is stored anywhere
  contents: read       # nothing is written back: the chain writes to the
                       # warehouse, not to git (7 Sep 2026)

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CAPACITY_ID: /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/nz-fuel-price-rg/providers/Microsoft.Fabric/capacities/nzfuelcapacity

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # One pin, dbt-core-experimental-parser, downloads its real wheel from
      # GitHub Releases rather than PyPI — the runner needs egress there, which
      # it has. See the note in requirements.txt.
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `dbt_packages/` is gitignored, so a clean checkout has none and every
      # dbt command fails on "expects 1 package(s) ... found only 0". Invisible
      # on this laptop, where the directory has been on disk since July. Found
      # on 10 Sep 2026, the first run in which anything after the gate executed
      # on a runner. Needs no warehouse — it only reads packages.yml.
      - name: Install dbt packages
        run: task deps

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Resuming is an ARM action on the capacity resource, a different
      # permission plane from the Fabric workspace role — the app registration
      # needs both. Waiting for Active is not optional: everything downstream
      # fails immediately with "this Fabric capacity is currently not active".
      - name: Resume the capacity
        run: task capacity-resume

      - name: Ingest
        if: ${{ !inputs.skip_ingest }}
        run: task ingest

      # `task ingest` already does this as its last act. This covers the other
      # path: the file landed on an earlier run, so the copy is skipped, but
      # the endpoint may still be serving what bronze held before it.
      - name: Make the SQL endpoint current
        if: ${{ inputs.skip_ingest }}
        run: task sync-endpoint

      # The gate exits 2 when there is no new week. That is not a failure, and
      # a red run every quiet week would train everyone to ignore red runs — so
      # it is caught here and ends the job green, with the reason in the log.
      #
      # `-x` is load-bearing: without it `task` reports its own exit code (201)
      # for any failed task rather than the command's, so `code` was never 2
      # and every quiet week went red. Found on the first full CI run,
      # 8 Sep 2026.
      - name: Gate
        id: gate
        run: |
          set +e
          task -x gate
          code=$?
          set -e
          if [ $code -eq 0 ]; then echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $code -eq 2 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "### No new week — the chain did not run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### The gate said stop and look" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: The rest of the chain
        if: steps.gate.outputs.proceed == 'true'
        run: |
          task aip
          task snapshot
          task build
          task test
          task panel
          task flags
          task backtest
          task report
          task close

      # always(), because `defer` inside task does not survive the runner being
      # cancelled or timing out. The 23:00 NZT auto-pause and the pause-capacity
      # workflow are the two lines behind this one.
      - name: Pause the capacity
        if: always()
        run: task capacity-pause

      - name: Say what is still manual
        if: always()
        run: |
          echo "The Power BI dataset is not refreshed by this workflow — the" >> "$GITHUB_STEP_SUMMARY"
          echo "report lives in My Workspace, where service principals cannot" >> "$GITHUB_STEP_SUMMARY"
          echo "reach it. That is W9." >> "$GITHUB_STEP_SUMMARY"
