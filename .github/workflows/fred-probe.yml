name: FRED reachability probe

# ONE-OFF, DISPOSABLE — delete this file once the first real weekly run has
# priced its weeks through the API.
#
# Round one (run 34434535269, 10 Sep 2026) answered the question it was built
# for. From a GitHub runner:
#
#   fredgraph.csv via curl      HTTP 200 in 2.9 s
#   fredgraph.csv via urllib    read timeout at 60 s
#   api.stlouisfed.org, no key  HTTP 400 in 0.18 s
#   api.stlouisfed.org, keyed   HTTP 200 in 0.2 s, series to 2026-09-04
#   Yahoo                       HTTP 429 — rate-limited on GitHub egress
#
# So FRED is reachable from CI in full and the fallback candidate is not; what
# fails is `fredgraph.csv` under urllib specifically, which is why `add_usd`
# now goes through the API. (Why that one combination fails is unresolved and
# deliberately not chased: we no longer use it.)
#
# Round two, below, is the verification that could not be done on the laptop —
# the key lives only in the repository secret, so this is the only place the
# real `add_usd` can be exercised against the real API before the weekly run
# depends on it. The PDF cache is gitignored and does not exist on a runner,
# so the weeks are synthesised: the FX half is what is under test, not the
# parsing, which has not changed.
#
# Costs nothing: no Azure login, no capacity, no warehouse write.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      - name: Price synthetic weeks through the real add_usd
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          .venv/bin/python - <<'PY'
          import sys
          import pandas as pd
          sys.path.insert(0, "pipeline")
          import aip_check as a

          # Six recent Fridays, stamped the way `parse()` stamps them, plus one
          # far in the future that no series can cover — so both branches are
          # exercised in one call: the covered weeks priced, the uncovered one
          # dropped by name.
          today = pd.Timestamp.today().normalize()
          fridays = [d for d in pd.date_range(end=today, periods=60, freq="D")
                     if d.weekday() == 4][-6:]
          future = today + pd.Timedelta(days=21)
          df = pd.DataFrame({"week": fridays + [future], "fuel": "Diesel",
                             "product_aucpl": 142.5})

          priced = a.add_usd(df)
          print(f"\npriced {len(priced)} of {len(df)} weeks")
          for _, r in priced.iterrows():
              print(f"  week to {r['week'].date()}  "
                    f"AUD/USD {r['aud_usd']:.5f}  "
                    f"-> {r['product_usd_bbl']:.2f} USD/bbl")

          # The failure this replaces was two weeks silently sharing a frozen
          # rate, so distinctness is the assertion, not a nicety.
          assert priced["aud_usd"].is_unique, "two weeks came back with the same rate"
          assert future not in set(priced["week"]), "the future week was priced"
          # Not asserted: how many of the six recent Fridays survive. FRED's
          # lag is the thing being defended against, so the newest one being
          # dropped is the mechanism working, not a failure.
          print(f"\nrates distinct, the uncovered week refused; "
                f"{len(df) - 1 - len(priced)} recent week(s) not yet covered")
          PY
