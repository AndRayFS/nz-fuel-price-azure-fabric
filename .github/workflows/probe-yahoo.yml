name: Probe Yahoo

# W23, step 1 (docs/workstreams.md) — temporary. The nowcast would put Yahoo's
# undocumented chart endpoint inside the weekly chain, and nothing about it has
# been measured from a runner. `pipeline/probe_yahoo.py` records Yahoo's raw
# answers and interprets none of them; its docstring lists what it asks for and
# the three questions the artifacts answer: is a runner answered, is a live
# daily bar the settlement, and when does Yahoo rewrite past `BZ=F` days around
# `BZF27`'s expiry on 30 Nov 2026.
#
# **The clock is in Azure, as for the load.** `trigger-probe-yahoo`, a Logic App
# in `nz-fuel-price-rg` defined by `infra/logic-apps/trigger-probe-yahoo.json`,
# posts a `workflow_dispatch` at 17:30 and 01:30 New York time, Monday to
# Saturday: after CME's close and before the next session opens, and after New
# York midnight. Its header says why those two hours. Before it, a cron
# here (19:45 UTC on weekdays) was meant to be acceptable even late, and it
# never fired: its first weekday, 9 Nov 2026, had no run by 23:00 UTC. The one
# other snapshot a week comes from the first step of weekly.yml, at the real run.
# `fetched_at_utc` in the manifest is the real time of each.
#
# It holds no secrets, touches nothing in Azure, and is not in the
# `fabric-capacity` concurrency group: it never waits on a load or holds one up.
#
# Artifacts are kept 30 days, which covers the expiry and the weeks either side
# of it. Delete this file when W23's step 2 has what it needs from it, and with
# it the Logic App and its token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # No pip install: the probe is standard library only.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Probe
        run: python pipeline/probe_yahoo.py --out "$RUNNER_TEMP/probe"

      # Also when the probe exits 1 (nothing answered 200): the manifest of
      # what failed, and how, is the answer to the first question.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: yahoo-probe
          path: ${{ runner.temp }}/probe/
          retention-days: 30
          if-no-files-found: warn
