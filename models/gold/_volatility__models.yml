version: 2

models:
  - name: factor_volatility
    columns:
      - name: Date
        tests:
          - not_null
          - unique
      - name: rolling_volatility
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: calm_baseline
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.1
