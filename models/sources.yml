version: 2

sources:
  - name: bronze
    database: bronze_lakehouse
    schema: mbie
    tables:
      - name: weekly_prices

  # Written by the weekly chain itself, not by dbt and not by a seed. These
  # three used to be CSVs in git that `dbt seed` loaded every week — the route
  # that made git the transport for data nobody writes by hand, and made every
  # unattended run a bot commit. The scripts write them straight to the
  # warehouse now (pipeline/warehouse_write.py); dbt reads them as sources
  # because dbt does not own them.
  - name: derived
    schema: dbo
    description: >
      Tables the weekly recompute writes directly, alongside silver and gold
      in `dbo` — layers here are told apart by name, not by schema. They are
      sources rather than models because dbt reads them and does not build
      them; they were seeds loaded from CSV until 7 Sep 2026.
    tables:
      - name: period_flags
        description: >
          Regime axes, one row per (week, fuel), rebuilt from the panel by
          rule. Replaced wholesale each run — it is a pure function of the
          panel, so losing it costs a recompute.
        columns:
          - name: week_date
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: fuel
            tests:
              - accepted_values:
                  arguments:
                    values: ['Diesel', 'Regular Petrol', 'Premium Petrol 95R']
                  config:
                    severity: warn
      - name: forecast_history
        description: >
          Walk-forward backtest output: what each method said at each cutoff
          and what happened. Replaced wholesale each run.
        columns:
          - name: week_date
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: pred_nowcast
            description: >
              The nowcast's call (W23): adl_ecm with the week in progress
              supplied by Brent over its Monday to Wednesday. What Report 1
              reads. Equal to pred_adl_ecm where nowcast_variant is 'none'.
          - name: nowcast_variant
            description: >
              How this run computed the row: '3 days' for every past week, from
              settled history; for the latest week the guard's decision — '3
              days', '2 days' (Wednesday missing) or 'none' (plain adl_ecm).
              Not tested: the guard's code is the only writer, and a 44th test
              would change the count Report 1 states on How it's built.
          - name: nowcast_reason
            description: >
              Why the variant is not the usual three days, in the guard's words;
              null otherwise.

  - name: monitoring_store
    schema: monitoring
    description: The monitoring contour's own accumulated observations.
    tables:
      - name: aip_singapore_weekly
        description: >
          Argus Singapore quotes republished weekly by the Australian
          Institute of Petroleum, written by `pipeline/aip_check.py`.
          APPEND-ONLY, and the one irreplaceable table in the project: AIP
          keeps 11-15 reports on its site and Mar-Jun 2026 is already gone
          from it, so weeks in here cannot be re-derived once they age out.
          It was a committed CSV loaded by `dbt seed --full-refresh` until
          7 Sep 2026 — that is, truncated and reloaded weekly from a file.
          Never truncate this. It sits in `monitoring`, not bronze, because
          nothing downstream of silver reads it. Data is Argus under AIP
          licence; attribution is required if any of it is republished.
        columns:
          - name: week
            description: Friday the AIP report averages to. Aligns with MBIE's `Date`.
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: fuel
            tests:
              - accepted_values:
                  arguments:
                    values: ['Diesel', 'Regular Petrol']
                  config:
                    severity: warn
          - name: product_usd_bbl
            description: AU cents/litre at the week's mean FRED DEXUSAL rate.
            tests:
              - not_null:
                  config:
                    severity: warn
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [week, fuel]
              config:
                severity: warn
