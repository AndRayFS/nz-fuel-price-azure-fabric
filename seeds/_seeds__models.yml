version: 2

seeds:
  - name: periods
    columns:
      - name: period_id
        tests:
          - unique
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: period_type
        tests:
          - accepted_values:
              arguments:
                values: ['crisis', 'calm']

  # Daily Brent spot (FRED DCOILBRENTEU), trimmed to MBIE's start date.
  # Purpose is diagnostic, not a new fact source: MBIE publishes ONE crude
  # number per week and does not say whether it is Friday's quote or the
  # week's average (docs/mbie_notes.md). A daily series is the only way to
  # tell. Brent is a different grade from MBIE's Dubai, so levels are not
  # comparable — only week-over-week co-movement is.
  #
  # Static snapshot: refreshing it means re-downloading the CSV by hand.
  - name: brent_daily
    config:
      column_types:
        date: date
        brent_usd_bbl: decimal(10,2)
    columns:
      - name: date
        tests:
          - unique
          - not_null
      - name: brent_usd_bbl
        tests:
          - not_null

  # Walk-forward backtest output, generated by research/backtest.py. One row
  # per (week, fuel, horizon): what the model would have said that week using
  # only data available then, beside what actually happened. This is what
  # gives Report 1 a time axis instead of a single latest-week number.
  #
  # NOT live forecasts. Every row is a retrospective simulation, and the
  # report must say so. Regenerate after each data refresh:
  #   python research/backtest.py && dbt seed --select forecast_history
  - name: forecast_history
    config:
      column_types:
        week_date: date
        target_week: date
    columns:
      - name: week_date
        tests:
          - not_null
      - name: fuel
        tests:
          - accepted_values:
              arguments:
                values: ['Regular Petrol', 'Diesel']
      # `actual_price` is deliberately NOT tested not_null: the most recent
      # rows are calls whose target week has not happened yet. That is the
      # live part of the report, not missing data.
      - name: price_now
        tests:
          - not_null
      - name: input_status
        tests:
          - accepted_values:
              arguments:
                values: ['final', 'provisional']

  - name: variable_mapping
    columns:
      - name: canonical_name
        tests:
          - unique
          - not_null
      - name: variable_name
        tests:
          - not_null

  # Several independent regime axes, replacing the single `period_type` of
  # `periods`. One row per (week, fuel), covering all 1,164 weeks — there is no
  # unlabelled residual. Generated, not hand-maintained: regenerate with
  # `python research/build_period_flags.py`, never by editing the CSV.
  #
  # Rationale, thresholds and the tests behind each axis: docs/period_labelling.md.
  #
  # `data_status` is the one to filter on before estimating anything. The 19
  # Provisional weeks from Apr 2026 are enough on their own to invert which
  # fuel appears to pass costs through faster (period_labelling.md §7).
  #
  # `periods` is deliberately still registered above: the two coexist until the
  # merge decision lands, and nothing has been removed from it.
  - name: period_flags
    columns:
      - name: week_date
        tests:
          - not_null
      - name: fuel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Regular Petrol', 'Diesel']
      - name: crude_vol_regime
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['high', 'normal']
      - name: crude_move_regime
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['large_up', 'large_down', 'normal']
      - name: data_regime
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre2010_unreconciled', 'envisory', 'datamine']
      - name: data_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['final', 'provisional']
      - name: supply_chain
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['domestic_refinery', 'import_only']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - week_date
              - fuel
