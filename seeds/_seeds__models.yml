version: 2

seeds:
  - name: periods
    columns:
      - name: period_id
        tests:
          - unique
          - not_null
      - name: start_date
        tests:
          - not_null
      - name: period_type
        tests:
          - accepted_values:
              arguments:
                values: ['crisis', 'calm']

  # Daily Brent spot (FRED DCOILBRENTEU), trimmed to MBIE's start date.
  # Purpose is diagnostic, not a new fact source: MBIE publishes ONE crude
  # number per week and does not say whether it is Friday's quote or the
  # week's average (docs/mbie_notes.md). A daily series is the only way to
  # tell. Brent is a different grade from MBIE's Dubai, so levels are not
  # comparable — only week-over-week co-movement is.
  #
  # Static snapshot: refreshing it means re-downloading the CSV by hand.
  - name: variable_mapping
    columns:
      - name: canonical_name
        tests:
          - unique
          - not_null
      - name: variable_name
        tests:
          - not_null

  # Several independent regime axes, replacing the single `period_type` of
  # `periods`. One row per (week, fuel), covering all 1,164 weeks — there is no
  # unlabelled residual. Generated, not hand-maintained: regenerate with
  # `python pipeline/build_period_flags.py`, never by editing the CSV.
  #
  # Rationale, thresholds and the tests behind each axis: docs/period_labelling.md.
  #
  # `data_status` was removed on 27 Aug 2026 (W14). It restated MBIE's own
  # Provisional/Final in a second place, and after W1 the source's status is
  # carried per value through silver and into the panel — read it there.
  #
  # `periods` is deliberately still registered above: the two coexist until the
  # merge decision lands, and nothing has been removed from it.
